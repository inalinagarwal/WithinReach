[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "within-reach"
version = "0.1.0"
description = "Human-to-robot cup pushing with a small action-conditioned dynamics model"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3", "mujoco>=3.2,<4", "opencv-python>=4.8,<5"]

[tool.setuptools.packages.find]
include = ["within_reach*"]

[tool.setuptools.package-data]
within_reach = ["assets/*.xml"]
